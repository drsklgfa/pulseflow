<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img" aria-labelledby="title desc">
  <title id="title">PulseFlow architecture</title><desc id="desc">Web dashboard communicates with NestJS API, PostgreSQL and Redis, with a BullMQ worker and notification providers.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6f87aa"/></marker><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#62e7ff"/><stop offset="1" stop-color="#8b7cff"/></linearGradient></defs>
  <rect width="1280" height="680" rx="24" fill="#081321"/>
  <g font-family="Inter,Segoe UI,sans-serif">
    <text x="52" y="58" fill="#f2f7ff" font-size="26" font-weight="750">PulseFlow architecture</text><text x="52" y="84" fill="#7890ae" font-size="14">One codebase, two presentation modes, real asynchronous infrastructure.</text>
    <g fill="none" stroke="#526b8e" stroke-width="2" marker-end="url(#arrow)"><path d="M225 220H380"/><path d="M580 220H720"/><path d="M480 285V410"/><path d="M815 285V410"/><path d="M905 490H1050"/><path d="M1140 410V310"/><path d="M1050 220H950"/></g>
    <g transform="translate(55 165)"><rect width="170" height="110" rx="18" fill="#102039" stroke="#29405f"/><text x="85" y="39" text-anchor="middle" fill="#62e7ff" font-size="13" font-weight="700">PRESENTATION</text><text x="85" y="70" text-anchor="middle" fill="#f0f6ff" font-size="18" font-weight="750">React dashboard</text><text x="85" y="91" text-anchor="middle" fill="#8096b4" font-size="11">Pages demo or Docker</text></g>
    <g transform="translate(380 165)"><rect width="200" height="120" rx="18" fill="#102039" stroke="#29405f"/><text x="100" y="39" text-anchor="middle" fill="#62e7ff" font-size="13" font-weight="700">CONTROL PLANE</text><text x="100" y="71" text-anchor="middle" fill="#f0f6ff" font-size="18" font-weight="750">NestJS API</text><text x="100" y="94" text-anchor="middle" fill="#8096b4" font-size="11">Auth · HMAC · REST · WS</text></g>
    <g transform="translate(720 165)"><rect width="190" height="120" rx="18" fill="#102039" stroke="#29405f"/><text x="95" y="39" text-anchor="middle" fill="#62e7ff" font-size="13" font-weight="700">EVENT BUS</text><text x="95" y="71" text-anchor="middle" fill="#f0f6ff" font-size="18" font-weight="750">Redis + BullMQ</text><text x="95" y="94" text-anchor="middle" fill="#8096b4" font-size="11">Retry · delay · DLQ · Pub/Sub</text></g>
    <g transform="translate(1050 165)"><rect width="175" height="120" rx="18" fill="#102039" stroke="#29405f"/><text x="87" y="39" text-anchor="middle" fill="#62e7ff" font-size="13" font-weight="700">EXTERNAL</text><text x="87" y="71" text-anchor="middle" fill="#f0f6ff" font-size="18" font-weight="750">Provider events</text><text x="87" y="94" text-anchor="middle" fill="#8096b4" font-size="11">Mock or Stripe sandbox</text></g>
    <g transform="translate(380 410)"><rect width="200" height="120" rx="18" fill="#102039" stroke="#29405f"/><text x="100" y="39" text-anchor="middle" fill="#9b8cff" font-size="13" font-weight="700">SOURCE OF TRUTH</text><text x="100" y="71" text-anchor="middle" fill="#f0f6ff" font-size="18" font-weight="750">PostgreSQL</text><text x="100" y="94" text-anchor="middle" fill="#8096b4" font-size="11">Prisma · audit · timeline</text></g>
    <g transform="translate(720 410)"><rect width="190" height="120" rx="18" fill="#102039" stroke="#29405f"/><text x="95" y="39" text-anchor="middle" fill="#9b8cff" font-size="13" font-weight="700">DATA PLANE</text><text x="95" y="71" text-anchor="middle" fill="#f0f6ff" font-size="18" font-weight="750">Worker</text><text x="95" y="94" text-anchor="middle" fill="#8096b4" font-size="11">Concurrency · backoff · DLQ</text></g>
    <g transform="translate(1050 410)"><rect width="175" height="120" rx="18" fill="#102039" stroke="#29405f"/><text x="87" y="39" text-anchor="middle" fill="#9b8cff" font-size="13" font-weight="700">DELIVERY</text><text x="87" y="71" text-anchor="middle" fill="#f0f6ff" font-size="18" font-weight="750">Adapters</text><text x="87" y="94" text-anchor="middle" fill="#8096b4" font-size="11">Mailpit · Resend · webhook</text></g>
    <g transform="translate(55 580)"><rect width="1170" height="52" rx="15" fill="#0f1d31" stroke="#243b59"/><rect x="18" y="15" width="22" height="22" rx="7" fill="url(#accent)"/><text x="54" y="33" fill="#c9d7ea" font-size="13"><tspan font-weight="700">Static portfolio mode:</tspan> the browser engine mirrors the same states and failure scenarios using localStorage, so GitHub Pages needs no API.</text></g>
  </g>
</svg>
