name: Release package

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build source archive
        run: |
          git archive --format=zip --output="pulseflow-${GITHUB_REF_NAME}.zip" HEAD
          sha256sum "pulseflow-${GITHUB_REF_NAME}.zip" > "pulseflow-${GITHUB_REF_NAME}.zip.sha256"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            pulseflow-${{ github.ref_name }}.zip
            pulseflow-${{ github.ref_name }}.zip.sha256
