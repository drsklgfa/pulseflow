name: pulseflow

x-app-environment: &app-environment
  APP_NAME: PulseFlow
  APP_VERSION: 1.0.1
  APP_MODE: ${APP_MODE:-demo}
  NODE_ENV: ${NODE_ENV:-production}
  DATABASE_URL: postgresql://pulseflow:pulseflow@postgres:5432/pulseflow?schema=public
  REDIS_URL: redis://redis:6379
  AUTH_SECRET: ${AUTH_SECRET:-pulseflow-development-auth-secret-change-before-production}
  ACCESS_TOKEN_EXPIRES_SECONDS: ${ACCESS_TOKEN_EXPIRES_SECONDS:-28800}
  BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@pulseflow.local}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-PulseFlow123!}
  PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
  WEBHOOK_SECRET: ${WEBHOOK_SECRET:-pulseflow-demo-webhook-secret}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  NOTIFICATION_PROVIDER: ${NOTIFICATION_PROVIDER:-smtp}
  SMTP_HOST: mailpit
  SMTP_PORT: 1025
  SMTP_SECURE: "false"
  SMTP_FROM: ${SMTP_FROM:-PulseFlow Demo <no-reply@pulseflow.local>}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  RESEND_FROM: ${RESEND_FROM:-}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
  WORKER_RATE_MAX: ${WORKER_RATE_MAX:-100}
  RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
  RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-120}
  LOGIN_RATE_LIMIT_MAX_REQUESTS: ${LOGIN_RATE_LIMIT_MAX_REQUESTS:-10}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pulseflow
      POSTGRES_USER: pulseflow
      POSTGRES_PASSWORD: pulseflow
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulseflow -d pulseflow"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${SMTP_PORT_HOST:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped

  setup:
    image: pulseflow-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: *app-environment
    command: ["sh", "-c", "npm run prisma:deploy && npm run prisma:seed"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  api:
    image: pulseflow-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *app-environment
      PORT: 3333
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    command: ["node", "apps/api/dist/main.js"]
    ports:
      - "${API_PORT:-3333}:3333"
    depends_on:
      setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3333/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  worker:
    image: pulseflow-worker:local
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment: *app-environment
    depends_on:
      setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  web:
    image: pulseflow-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3333/api/v1}
        VITE_DEMO_MODE: "false"
        VITE_BASE_PATH: /
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
